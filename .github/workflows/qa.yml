name: qa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install playwright + chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Serve site on :8010
        run: |
          python -m http.server 8010 --directory . > /tmp/http.log 2>&1 &
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://localhost:8010/

      - name: QA sweep
        run: python tools/qa.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-shots
          path: tools/shots/
