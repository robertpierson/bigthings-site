<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Big Things — social share card (1200×630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Tokens lifted verbatim from ../styles.css */
  :root {
    --ink:      #060a10;
    --brand:    #2f89c5;
    --brand-hi: #6fc3e8;
    --paper:    #f2f6f9;
    --muted:    #9fb2c4;
    --line:     rgba(47,137,197,.18);

    --sans: Inter, ui-sans-serif, system-ui, sans-serif;
    --display: Montserrat, var(--sans);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1200px; height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* same three washes as .bg-drift, motion removed */
  .bg-drift {
    position: absolute; inset: -10%; z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(47,137,197,.22), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(111,195,232,.16), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(30,78,122,.18), transparent 60%);
  }

  .card {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    padding: 72px;
    display: flex; flex-direction: column;
  }

  .row {
    flex: 1;
    display: flex; align-items: center; gap: 56px;
    min-width: 0;
  }

  .logo {
    width: 150px; height: 150px; flex-shrink: 0;
    filter: drop-shadow(0 0 40px rgba(47,137,197,.5));
  }

  .eyebrow {
    margin: 0 0 18px;
    display: flex; align-items: center; gap: .7em;
    font-family: var(--mono); font-size: 15px; font-weight: 500;
    letter-spacing: .32em; text-transform: uppercase;
    color: var(--brand-hi);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--brand-hi);
    box-shadow: 0 0 12px var(--brand-hi);
  }

  .title {
    margin: 0 0 20px;
    font-family: var(--display); font-weight: 800;
    font-size: 130px; line-height: .9; letter-spacing: -.02em;
    white-space: nowrap;
    text-shadow: 0 0 60px rgba(47,137,197,.45);
  }

  .lede {
    margin: 0;
    color: var(--muted);
    font-size: 26px; line-height: 1.4;
  }

  .foot {
    flex-shrink: 0;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 15px; font-weight: 500;
    letter-spacing: .28em; text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="bg-drift"></div>

  <div class="card">
    <div class="row">
      <img class="logo" src="../images/animated-logo.svg" alt="" width="150" height="150">
      <div>
        <p class="eyebrow"><span class="dot"></span>Now open</p>
        <h1 class="title">BIG THINGS</h1>
        <p class="lede">Exposure and support for community-centric software.</p>
      </div>
    </div>
    <div class="foot">bigthingssoftware.org</div>
  </div>
</body>
</html>
