<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Big Things</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060a10">

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* 404-only: single centered column, hero type dialled down */
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; }
    .nf .hero-title { font-size: clamp(1.9rem, 5.5vw, 3.25rem); text-transform: none; }
    .nf .hero-lede { color: #9fb2c4; margin-inline: auto; }
    .nf .eyebrow { justify-content: center; }
    .nf .hero-cta { margin-bottom: 0; }
  </style>
</head>
<body>

<div class="bg-drift" aria-hidden="true"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="nf" id="main">
  <div class="wrap wrap-narrow">
    <p class="eyebrow">404</p>
    <h1 class="hero-title">This one's still in orbit.</h1>
    <p class="hero-lede">That page isn't here — it may have moved, or it may not exist yet.</p>

    <div class="hero-cta">
      <a class="btn" href="/">Back to home</a>
      <a class="btn-ghost" href="https://discord.gg/8FXs9WhC8t" target="_blank" rel="noopener">Join the Discord</a>
    </div>
  </div>
</main>

</body>
</html>
